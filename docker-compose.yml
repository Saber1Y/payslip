# Local development database. Not used in production.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: payslip
      POSTGRES_PASSWORD: payslip
      POSTGRES_DB: payslip
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - payslip-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payslip -d payslip"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  payslip-pg:
